global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: recsys-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Batch jobs (drift monitoring) push here; honor_labels keeps their job label.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
