# Local development: SQLite online store + file offline store (no services needed).
# Paths are relative to this directory.
project: recsys
provider: local
registry: ../data/feast/registry.db
online_store:
  type: sqlite
  path: ../data/feast/online_store.db
offline_store:
  type: file
entity_key_serialization_version: 3
auth:
  type: no_auth
